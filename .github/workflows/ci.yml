name: notely CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "533813050020"
  # --- ECR (rollback): uncomment these two + the ECR steps below, and comment the JFrog lines/steps ---
  # ECR_REPO_BACK: 533813050020.dkr.ecr.us-east-1.amazonaws.com/idan/notely-back
  # ECR_REPO_FRONT: 533813050020.dkr.ecr.us-east-1.amazonaws.com/idan/notely-front
  # --- JFrog Artifactory (Xray POC) ---
  JFROG_REGISTRY: idandev.jfrog.io
  REGISTRY_REPO_BACK: idandev.jfrog.io/notely-docker-local-docker-local/idan/notely-back
  REGISTRY_REPO_FRONT: idandev.jfrog.io/notely-docker-local-docker-local/idan/notely-front
  PRODUCT: notely

# Least privilege: every job gets a read-only GITHUB_TOKEN by default; jobs
# that need more (publish pushes the release tag) elevate individually.
permissions:
  contents: read

# One run per branch: superseded PR runs are cancelled to save minutes, but
# runs on main are queued (never cancelled) so a publish is never killed mid-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      # Same versioning scheme as the Jenkins pipeline: take the latest git tag
      # and bump the patch part; first release falls back to "<version.txt>.0".
      - name: Compute version tag
        id: version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$last_tag" ]; then
              major_minor=${last_tag%.*}
              patch=${last_tag##*.}
              tag="${major_minor}.$((patch + 1))"
            else
              tag="$(cat version.txt).0"
            fi
          else
            tag="$(cat version.txt)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version tag: $tag"

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python -m pip install --upgrade pip
          pip install -r flask-notely/requirements.txt
          pytest

  # Static analysis of our own code: ruff lints for bug-prone patterns, bandit
  # looks for security issues (hardcoded passwords, injection, weak crypto).
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Ruff lint
        continue-on-error: true  # report-only — delete this line to make blocking
        run: pipx run ruff check flask-notely

      # -ll = medium severity and up; tests excluded (bandit flags pytest's
      # assert usage as B101, which is noise).
      - name: Bandit SAST
        continue-on-error: true  # report-only — delete this line to make blocking
        run: pipx run bandit -r flask-notely -ll -x flask-notely/venv,flask-notely/test_routers_unit.py,flask-notely/testing_e2e.py

  # Scans the FULL git history (fetch-depth: 0), not just the diff: a secret
  # that was ever pushed is compromised even if a later commit removed it.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Gitleaks
        continue-on-error: true  # report-only — delete this line to make blocking
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Known-CVE scan of third-party dependencies (ours are scanned by sast above).
  deps-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        continue-on-error: true  # report-only — delete this line to make blocking
        run: pipx run pip-audit -r flask-notely/requirements.txt

      # Audits package-lock.json directly — no npm install needed. Blocking
      # this step will fail until react-scripts is upgraded off ^3.0.1.
      - name: npm audit (frontend)
        continue-on-error: true  # report-only — delete this line to make blocking
        working-directory: notely-front
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: version
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Build images
        run: |
          docker build -t "${PRODUCT}_flask_image:${TAG}" flask-notely
          docker build -t "${PRODUCT}_nginx_image:${TAG}" notely-front

      # Scan the images BEFORE saving them: once blocking (exit-code: "1"),
      # a vulnerable image never even becomes a workflow artifact.
      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0
        with:
          image-ref: ${{ env.PRODUCT }}_flask_image:${{ env.TAG }}
          severity: HIGH,CRITICAL
          exit-code: "0"  # report-only — change to "1" to make blocking

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0
        with:
          image-ref: ${{ env.PRODUCT }}_nginx_image:${{ env.TAG }}
          severity: HIGH,CRITICAL
          exit-code: "0"  # report-only — change to "1" to make blocking

      # SBOM (software bill of materials): a machine-readable inventory of every
      # package in the image, so "are we affected by CVE-X?" is answerable later
      # without rebuilding anything.
      - name: SBOM backend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0
        with:
          image-ref: ${{ env.PRODUCT }}_flask_image:${{ env.TAG }}
          format: cyclonedx
          output: sbom-backend.cdx.json

      - name: SBOM frontend image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0
        with:
          image-ref: ${{ env.PRODUCT }}_nginx_image:${{ env.TAG }}
          format: cyclonedx
          output: sbom-frontend.cdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sboms
          path: sbom-*.cdx.json

      # Hand the images to the publish job: jobs run on separate runners, so
      # the images are saved as a workflow artifact and loaded back there.
      - name: Save images
        run: docker save "${PRODUCT}_flask_image:${TAG}" "${PRODUCT}_nginx_image:${TAG}" -o images.tar

      - name: Upload images artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: docker-images
          path: images.tar
          retention-days: 1

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # Only backend + mongo: the nginx image hardcodes the in-cluster DNS
      # resolver and cannot run outside Kubernetes; CI only tests the backend.
      # Compose builds the backend image from source, so this job does not
      # depend on the build job's artifacts.
      - name: Run app with docker compose
        run: docker compose up -d backend mongo

      - name: Health check
        run: |
          sleep 10
          for i in $(seq 1 5); do
            status=$(curl -o /dev/null -s -w '%{http_code}' http://localhost:5001/health || true)
            echo "health check attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "backend is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "health check failed after 5 attempts"
          docker compose logs
          exit 1

      - name: E2E tests
        env:
          BASE_URL: http://localhost:5001
        run: |
          pip install requests
          python flask-notely/testing_e2e.py

      - name: Cleanup
        if: always()
        run: docker compose down || true

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [version, unit-tests, build, e2e-tests, sast, secret-scan, deps-scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # The only job that needs to write: it pushes the release tag.
    permissions:
      contents: write
      # id-token: write  # re-add only if the commented ECR/OIDC steps below return
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download images artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: docker-images

      - name: Load images
        run: docker load -i images.tar

      - name: Push release tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -a "$TAG" -m "new tag for version $TAG"
          git push origin "$TAG"

      # --- ECR path: uncomment these three steps (and the ECR_REPO_* env vars) to switch back ---
      # - name: Configure AWS credentials (OIDC)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::533813050020:role/notely-github-actions
      #     aws-region: us-east-1
      #
      # - name: Login to Amazon ECR
      #   uses: aws-actions/amazon-ecr-login@v2
      #
      # - name: Push images to ECR
      #   run: |
      #     docker tag "${PRODUCT}_flask_image:${TAG}" "${ECR_REPO_BACK}:${TAG}"
      #     docker tag "${PRODUCT}_nginx_image:${TAG}" "${ECR_REPO_FRONT}:${TAG}"
      #     docker push "${ECR_REPO_BACK}:${TAG}"
      #     docker push "${ECR_REPO_FRONT}:${TAG}"

      - name: Login to JFrog Artifactory
        run: echo "${{ secrets.JFROG_TOKEN }}" | docker login "$JFROG_REGISTRY" -u "${{ secrets.JFROG_USER }}" --password-stdin

      - name: Push images to Artifactory
        run: |
          docker tag "${PRODUCT}_flask_image:${TAG}" "${REGISTRY_REPO_BACK}:${TAG}"
          docker tag "${PRODUCT}_nginx_image:${TAG}" "${REGISTRY_REPO_FRONT}:${TAG}"
          docker push "${REGISTRY_REPO_BACK}:${TAG}"
          docker push "${REGISTRY_REPO_FRONT}:${TAG}"

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e  # v5.1.0
        env:
          JF_URL: https://idandev.jfrog.io
          JF_ACCESS_TOKEN: ${{ secrets.JFROG_TOKEN }}

      # Non-blocking for the POC: prints Xray vulnerability results in the build
      # log. Remove continue-on-error to gate releases on the scan.
      - name: Xray scan images
        continue-on-error: true
        run: |
          jf docker scan "${REGISTRY_REPO_BACK}:${TAG}"
          jf docker scan "${REGISTRY_REPO_FRONT}:${TAG}"

  # Port of the Jenkins "notely_update_version" job: bump appVersion in the
  # GitOps repo's Chart.yaml so ArgoCD deploys the new image tag.
  update-gitops:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [version, publish]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout notely-kubernetes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: iddchn/notely-kubernetes
          token: ${{ secrets.KubeRepoToken }}
          path: kube-repo

      - name: Bump chart appVersion
        run: |
          cd kube-repo
          sed -i "s/^appVersion: \".*\"/appVersion: \"$TAG\"/" notely/notely-chart/Chart.yaml
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add notely/notely-chart/Chart.yaml
          git commit -m "update chart version $TAG"
          git push origin main
